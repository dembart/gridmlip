[metadata]
name = gridmlip
version = attr: gridmlip._version.__version__
author = Artem Dembitskiy
author_email = art.dembitskiy@gmail.com
url = https://github.com/dembart/gridmlip
description = gridmlip
long_description = file: README.md
long_description_content_type = text/markdown
keywords = MLIP, percolation barrier, irreducible mesh
license = MIT
classifiers =
    License :: OSI Approved :: BSD License
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    

[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    numpy
    spglib
    ase
    tqdm
    scipy
    joblib



