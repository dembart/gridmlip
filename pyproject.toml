[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmlip"
dynamic = ["version"]
description = "gridmlip"
readme = "README.md"
authors = [
    { name = "Artem Dembitskiy", email = "art.dembitskiy@gmail.com" }
]
keywords = ["MLIP", "percolation barrier", "irreducible mesh"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "spglib",
    "tqdm",
    "ions",
    "pymatgen",
]

[project.optional-dependencies]
# numba: 10-100x faster percolation analysis (otherwise the scipy backend is used)
fast = [
    # Intel Macs: use the last version with binary wheels
    "numba>=0.62,<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # Apple Silicon, Linux, Windows
    "numba>=0.62,<0.69; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# dataset generation: SOAP, PCA, farthest point sampling, rattling, YAML settings
ml = ["dscribe>=2", "scikit-learn", "fpsample", "vesin", "pyyaml"]
test = ["pytest"]
# MLIPs (mace-torch, sevenn, gnn_lib) are integrations: used if installed, not extras

[project.scripts]
gridmlip = "gridmlip.cli:main"

[project.urls]
Homepage = "https://github.com/dembart/gridmlip"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.package-data]
gridmlip = ["view/*.js", "view/*.html", "view/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "gridmlip._version.__version__" }

[tool.setuptools.packages.find]
# This mimics 'packages = find:' from setup.cfg

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not umlip'"
markers = ["umlip: tests that run universal MLIPs (slow); select with -m umlip"]
