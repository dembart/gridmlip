[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmlip"
dynamic = ["version"]
description = "gridmlip"
readme = "README.md"
authors = [
    { name = "Artem Dembitskiy", email = "art.dembitskiy@gmail.com" }
]
keywords = ["MLIP", "percolation barrier", "irreducible mesh"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy",
    "spglib",
    "ase",
    "ions",
    "tqdm",
    "scipy",
    "fpsample",
]

[project.optional-dependencies]
fast = [
    # Intel Macs: use the last version with binary wheels
    "numba>=0.62,<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # Apple Silicon, Linux, Windows
    "numba>=0.62,<0.69; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
scikit-learn = ["scikit-learn"]
dscribe = ["dscribe>=2"]
bvse = ["pymatgen"]
dataset = ["scikit-learn", "dscribe>=2", "fpsample", "vesin", "pyyaml"]
test = ["pytest"]
mace = ["mace-torch"]
sevenn = ["sevenn"]
gnn_lib = ["gnn_lib"]

[project.scripts]
gridmlip = "gridmlip.cli:main"

[project.urls]
Homepage = "https://github.com/dembart/gridmlip"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "gridmlip._version.__version__" }

[tool.setuptools.packages.find]
# This mimics 'packages = find:' from setup.cfg

[tool.pytest.ini_options]
testpaths = ["tests"]
