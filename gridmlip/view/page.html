<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>__TITLE__</title>
__3DMOL__
<style>
 :root{--bg:rgba(255,255,255,.94);--fg:#1f2328;--muted:#6b7280;--line:#e3e5e8;--field:#fff;--fieldline:#cfd3d8;
       --accent:#2f8f63;--accent-soft:#e3f3ea;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
 body.dark{--bg:rgba(32,34,38,.94);--fg:#e6e6e6;--muted:#9aa0a6;--line:#3a3d43;--field:#2a2d32;--fieldline:#474b52;
           --accent:#7fd1a4;--accent-soft:#2e3f36;background:#1f2125}
 body{margin:0;font:12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--fg)}
 #viewer{position:fixed;inset:0}
 #axes{position:fixed;right:16px;bottom:16px;width:140px;height:140px;pointer-events:none;overflow:visible}
 #axes text{font:600 13px ui-sans-serif,system-ui,sans-serif;pointer-events:auto;cursor:pointer;dominant-baseline:central;text-anchor:middle}
 #panel{position:fixed;top:12px;left:12px;width:264px;max-height:calc(100vh - 24px);overflow:auto;
        background:var(--bg);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 4px 18px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
 #head{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
 #head .t{flex:1;min-width:0} #title{font-weight:600;font-size:13.5px}
 #sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #collapse{border:none;background:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
 body.collapsed #body{display:none} body.collapsed #head{border-bottom:none}
 .sec{padding:9px 12px;border-bottom:1px solid var(--line)} .sec:last-child{border-bottom:none}
 .sec h4{margin:0 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
 .row{display:flex;align-items:center;gap:6px;margin:6px 0} .row .lab{width:58px;color:var(--muted);flex:none}
 input[type=text],input[type=number],select{font:inherit;color:var(--fg);background:var(--field);
   border:1px solid var(--fieldline);border-radius:6px;padding:3px 6px;min-width:0}
 input[type=number]{width:34px;flex:none;text-align:center} #levelnum{width:54px;flex:none;font-family:var(--mono)} select{flex:1}
 .unit{color:var(--muted)}
 .seg{display:inline-flex;border:1px solid var(--fieldline);border-radius:6px;overflow:hidden}
 .seg button{font:inherit;color:var(--fg);background:var(--field);border:none;border-right:1px solid var(--fieldline);
   padding:3px 8px;cursor:pointer} .seg button:last-child{border-right:none}
 .seg button:hover:not(:disabled){background:var(--accent-soft)} .seg button:disabled{color:var(--muted);cursor:default}
 button.btn{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--fieldline);border-radius:6px;
   padding:3px 9px;cursor:pointer} button.btn:hover{background:var(--accent-soft)}
 input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
 #bar{color:var(--muted);font-size:11.5px;margin:2px 0 0;white-space:nowrap} #bar b{color:var(--fg);font-weight:500;font-family:var(--mono)}
 .chips{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
 .chips label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
 .exp{border:none;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:10px;line-height:1}
 .exp:hover{color:var(--accent)}
 #elems{grid-template-columns:repeat(3,1fr);margin:6px 0 0 18px} #elems.off{opacity:.45}
 .dot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.35)}
 input[type=checkbox]{accent-color:var(--accent);margin:0}
 .x{color:var(--muted)}
 .hint{color:var(--muted);font-size:11.5px;margin:0 0 6px}
 #out{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;background:var(--field);
   border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-height:1.4em;max-height:200px;overflow:auto}
 #out:empty::before{content:"nothing selected";color:var(--muted);font-family:inherit}
 #poly{margin-top:8px;font-size:12px} #poly:empty{display:none}
 #poly .ph{font-weight:600} #poly .pm{color:var(--muted);font-size:11.5px;margin:2px 0 4px}
 #poly table{border-collapse:collapse;width:100%} #poly td{padding:1px 0}
 #poly td.r{text-align:right;font-family:var(--mono)}
 #msg{color:#d14343;font-size:11.5px} #msgsec:has(#msg:empty){display:none}
</style></head><body class="dark">
<div id="viewer"></div>
<svg id="axes" viewBox="-55 -55 110 110"></svg>
<div id="panel">
 <div id="head">
  <div class="t"><div id="title"></div><div id="sub"></div></div>
  <button id="collapse" title="collapse / expand">−</button>
 </div>
 <div id="body">
  <div class="sec">
   <h4>Isosurface</h4>
   <div class="row"><span class="lab">Level</span>
    <input id="levelnum" type="text" inputmode="decimal"><span class="unit">eV above min</span></div>
   <input id="slider" type="range" min="0" step="0.005">
   <div class="row"><span class="lab">Barrier</span>
    <span class="seg"><button data-b="e1d">1D</button><button data-b="e2d">2D</button><button data-b="e3d">3D</button></span></div>
   <div id="bar"></div>
  </div>
  <div class="sec">
   <h4>Layers</h4>
   <div class="chips">
    <label><input type="checkbox" id="t_surf" checked> Isosurface</label>
    <label><input type="checkbox" id="t_poly" checked> Polyhedra</label>
    <label><input type="checkbox" id="t_atoms" checked> Atoms<button class="exp" id="t_elx" title="show/hide single elements">▸</button></label>
    <label><input type="checkbox" id="t_bonds" checked> Bonds</label>
    <label><input type="checkbox" id="t_min"> Energy minima</label>
    <label><input type="checkbox" id="t_axes" checked> Axes</label>
   </div>
   <div class="chips" id="elems" style="display:none"></div>
  </div>
  <div class="sec">
   <h4>View</h4>
   <div class="row"><span class="lab">Along</span>
    <span class="seg"><button id="va">a</button><button id="vb">b</button><button id="vc">c</button></span>
    <button class="btn" id="home" style="margin-left:auto" title="orientation, centering and zoom">Reset</button>
   </div>
   <div class="row"><span class="lab">Rotate</span>
    <select id="axis"><option value="free">free (drag direction)</option><option value="a">about a</option>
     <option value="b">about b</option><option value="c">about c</option><option value="uvw">about [u v w]</option></select>
    <input id="uvw" type="text" value="1 1 0" style="width:52px;display:none" title="u v w">
   </div>
   <div class="row"><span class="lab">Supercell</span>
    <input id="nx" type="number" min="1" max="4" value="1"><span class="x">×</span>
    <input id="ny" type="number" min="1" max="4" value="1"><span class="x">×</span>
    <input id="nz" type="number" min="1" max="4" value="1">
   </div>
   <div class="row"><span class="lab">Theme</span><label class="chips" style="display:flex"><input type="checkbox" id="t_dark"> Dark</label></div>
  </div>
  <div class="sec">
   <h4>Measure</h4>
   <p class="hint">Click an atom: coordinates. Double-click 2 atoms: distance. Triple-click 3 atoms: angle (2nd is the vertex). Click a polyhedron: its bonds.</p>
   <div id="out"></div>
   <div id="poly"></div>
   <div class="row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" id="clear">Clear</button></div>
  </div>
  <div class="sec" id="msgsec" style="padding-top:0;border-bottom:none"><div id="msg"></div></div>
 </div>
</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
// 3Dmol lights with one diffuse light only. Add ambient light and specular highlights (VESTA-like:
// atoms specular 0.8, shininess 25.6; meshes (polyhedra, bonds, isosurface) glossier). 3Dmol does not
// export its shaders, so the GLSL text is patched when it is handed to WebGL; unknown text passes unchanged.
(function patchShaders() {
  const LIT_V = `vec3 halfv = normalize(dirVector + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(transformedNormal, halfv), 0.0), 64.0);
    vLightFront += directionalLightColor[ 0 ] * (0.25 + 0.55 * directionalLightWeighting) + vec3(0.18 * spec);`;
  const SPH_F = `float diff = max(dot(norm, vLight), 0.0);
    vec3 halfv = normalize(vLight + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(norm, halfv), 0.0), 25.6);
    vec3 color = vColor * (0.25 + 0.6 * diff) * directionalLightColor[ 0 ] + vec3(0.45 * spec);`;
  window.shaderPatches = {sphere: 0, mesh: 0};
  function patch(src) {
    let out = src.replace(/float dotProduct = dot\( norm, vLight \);[\s\S]*?vec3 color = vLight\*vColor;/, SPH_F);
    if (out !== src) window.shaderPatches.sphere++;
    const before = out;
    out = out.replace("vLightFront += directionalLightColor[ 0 ] * directionalLightWeighting;", LIT_V)
             .replace("vLightBack += directionalLightColor[ 0 ] * directionalLightWeightingBack;",
                      "vLightBack += directionalLightColor[ 0 ] * (0.25 + 0.55 * directionalLightWeightingBack);");
    if (out !== before) window.shaderPatches.mesh++;
    return out;
  }
  for (const C of [window.WebGLRenderingContext, window.WebGL2RenderingContext]) {
    if (!C) continue;
    const orig = C.prototype.shaderSource;
    C.prototype.shaderSource = function (shader, src) { return orig.call(this, shader, patch(src)); };
  }
})();
const viewer = $3Dmol.createViewer("viewer", {backgroundColor: "#f7f7f5", orthographic: true});
function applyTheme() {
  const dark = $("t_dark").checked;
  document.body.classList.toggle("dark", dark);
  viewer.setBackgroundColor(dark ? "#1f2125" : "#f7f7f5");
  if (typeof drawCells === "function" && models.fw) { drawCells(); viewer.render(); }
}
const fmt = v => v.toFixed(3);
const P = v => ({x: v[0], y: v[1], z: v[2]});
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const A = D.cell, N = D.grid.n;
const BOHR = 0.529177210903;
const values = Float32Array.from(D.grid.values.split(" ").map(Number));
window.timing = {};

let sc = [1, 1, 1], models = {}, polyShapes = [], cellShapes = [], surf = null, vol = null, level = null;
let picks = [], marks = [], hilite = [];
const hidden = new Set(D.opts.hide);  // element symbols not drawn

function shift(i, j, k) { return [0, 1, 2].map(c => i * A[0][c] + j * A[1][c] + k * A[2][c]); }
function copies() { const out = []; for (let i = 0; i < sc[0]; i++) for (let j = 0; j < sc[1]; j++)
  for (let k = 0; k < sc[2]; k++) out.push([i, j, k]); return out; }

// --- volume data for the current supercell: the unit-cell grid tiled sc[0] x sc[1] x sc[2] times
function buildVolume() {
  const t = performance.now();
  const n = [N[0] * sc[0], N[1] * sc[1], N[2] * sc[2]];
  const head = ["gridmlip energy map", "eV above the minimum", "    1 0.0 0.0 0.0"];
  for (let a = 0; a < 3; a++) {
    const s = A[a].map(c => c / N[a] / BOHR);
    head.push(`${n[a]} ${s[0]} ${s[1]} ${s[2]}`);
  }
  head.push("    1 0.0 0.0 0.0 0.0");
  const body = new Array(n[0] * n[1] * n[2]);
  let p = 0;
  for (let i = 0; i < n[0]; i++) { const bi = (i % N[0]) * N[1];
    for (let j = 0; j < n[1]; j++) { const bj = (bi + j % N[1]) * N[2];
      for (let k = 0; k < n[2]; k++) body[p++] = values[bj + k % N[2]]; } }
  vol = new $3Dmol.VolumeData(head.join("\n") + "\n" + body.join(" ") + "\n", "cube");
  window.timing.volume_ms = performance.now() - t;
}

// --- atoms (framework, image ligands, low-energy sites) for every copy
function atomList() {
  const fw = [], im = [], mn = [];
  copies().forEach(c => {
    const T = shift(...c);
    D.atoms.forEach((a, i) => fw.push({...a, xyz: add3(a.xyz, T), idx: i, cellidx: c}));
    D.minima.forEach((m, i) => mn.push({elem: "He", xyz: add3(m.xyz, T), e: m.e, idx: i, cellidx: c}));
    D.images.forEach(a => {  // keep only ligands outside the whole supercell (inside ones are real atoms)
      const f = add3(a.frac, c);
      if (f.some((x, d) => x < -1e-3 || x > sc[d] - 1e-3))
        im.push({...a, xyz: add3(a.xyz, T), frac: f, idx: -1, cellidx: c});
    });
  });
  return {fw, im, mn};
}
function addModel(list, tag) {
  const txt = list.length + "\n\n" + list.map(a => `${a.elem} ${a.xyz.join(" ")}`).join("\n");
  const m = viewer.addModel(txt, "xyz");
  m.selectedAtoms({}).forEach((a, i) => { a.info = list[i]; a.tag = tag; });
  return m;
}

function styleAtoms() {
  const show = $("t_atoms").checked;
  models.fw.setStyle({}, {}); models.im.setStyle({}, {});
  if (show) Object.entries(D.elements).forEach(([e, s]) => {
    if (hidden.has(e)) return;  // single elements can be hidden (Layers ▸ Atoms ▸)
    models.fw.setStyle({elem: e}, {sphere: {radius: s.radius, color: s.color}});
    models.im.setStyle({elem: e}, {sphere: {radius: s.radius, color: s.color, opacity: 0.8}});
  });
}
function styleSites() { models.mn.setStyle({}, $("t_min").checked ? {sphere: {radius: 0.22, color: "#00a3ff"}} : {}); }

function drawCells() {
  cellShapes.forEach(s => viewer.removeShape(s)); cellShapes = [];
  const E = [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  const corner = (c, b) => add3(shift(...c), shift((b >> 2) & 1, (b >> 1) & 1, b & 1));
  copies().forEach(c => E.forEach(([p, q]) => cellShapes.push(viewer.addCylinder(
    {start: P(corner(c, p)), end: P(corner(c, q)), radius: 0.012, color: $("t_dark").checked ? "#c8c8c8" : "#202020", fromCap: 1, toCap: 1}))));
}
function drawPolyhedra() {
  polyShapes.forEach(s => viewer.removeShape(s)); polyShapes = [];
  if (!$("t_poly").checked) return;
  copies().forEach(c => { const T = shift(...c);
    D.polyhedra.forEach(p => {
      polyShapes.push(viewer.addCustom({vertexArr: p.vertices.map(v => P(add3(v, T))), normalArr: p.normals.map(P),
                                        faceArr: p.faces, color: p.color, opacity: D.opts.polyhedra_opacity,
                                        clickable: true, callback: () => showPolyhedron(p, c)}));
      p.edges.forEach(([a, b]) => polyShapes.push(viewer.addCylinder(
        {start: P(add3(a, T)), end: P(add3(b, T)), radius: 0.008, color: "#a0a0a0", fromCap: 1, toCap: 1})));
    });
  });
}
let bondShapes = [];
function drawBonds() {  // ball-and-stick: center-ligand bonds of the polyhedra, split in the two atom colors
  bondShapes.forEach(s => viewer.removeShape(s)); bondShapes = [];
  if (!$("t_bonds").checked) return;
  const col = e => (D.elements[e] || {color: "#999999"}).color;
  copies().forEach(c => { const T = shift(...c);
    D.polyhedra.forEach(p => {
      const a = add3(D.atoms[p.idx].xyz, T);
      p.ligands.forEach(l => {
        const b = add3(l.xyz, T), m = [(a[0]+b[0])/2, (a[1]+b[1])/2, (a[2]+b[2])/2];
        bondShapes.push(viewer.addCylinder({start: P(a), end: P(m), radius: 0.06, color: col(p.elem), fromCap: 1, toCap: 0}));
        bondShapes.push(viewer.addCylinder({start: P(m), end: P(b), radius: 0.06, color: col(l.elem), fromCap: 0, toCap: 1}));
      });
    });
  });
}

// --- rotation. Free: every mouse move turns the scene about the screen axis perpendicular to the
//     drag, so a straight drag always spins about one fixed axis. Locked: dragging left/right spins
//     about a chosen crystal axis (a, b, c or [u v w]) and nothing else. Wheel zooms, ctrl/middle-drag pans.
const norm3 = v => { const n = Math.hypot(...v); return v.map(x => x / n); };
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross3 = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
function qmul(a, b) {  // [x, y, z, w]
  return [a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1], a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
          a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3], a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
}
const qnorm = q => { const n = Math.hypot(...q); return q.map(x => x / n); };
function qaxis(axis, deg) {
  const n = Math.hypot(...axis);
  if (!(n > 1e-12) || !isFinite(deg)) return [0, 0, 0, 1];   // zero-length axis: no rotation
  const h = deg * Math.PI / 360, s = Math.sin(h) / n;
  return [axis[0]*s, axis[1]*s, axis[2]*s, Math.cos(h)];
}
function qmat(r) {  // rotation matrix (rows) -> quaternion
  const t = r[0][0] + r[1][1] + r[2][2];
  if (t > 0) { const s = 0.5 / Math.sqrt(t + 1); return [(r[2][1]-r[1][2])*s, (r[0][2]-r[2][0])*s, (r[1][0]-r[0][1])*s, 0.25 / s]; }
  if (r[0][0] > r[1][1] && r[0][0] > r[2][2]) { const s = 2 * Math.sqrt(1 + r[0][0] - r[1][1] - r[2][2]);
    return [0.25 * s, (r[0][1]+r[1][0]) / s, (r[0][2]+r[2][0]) / s, (r[2][1]-r[1][2]) / s]; }
  if (r[1][1] > r[2][2]) { const s = 2 * Math.sqrt(1 + r[1][1] - r[0][0] - r[2][2]);
    return [(r[0][1]+r[1][0]) / s, 0.25 * s, (r[1][2]+r[2][1]) / s, (r[0][2]-r[2][0]) / s]; }
  const s = 2 * Math.sqrt(1 + r[2][2] - r[0][0] - r[1][1]);
  return [(r[0][2]+r[2][0]) / s, (r[1][2]+r[2][1]) / s, 0.25 * s, (r[1][0]-r[0][1]) / s];
}
function lookAlong(dir, up) {  // orientation with dir pointing at the viewer and up vertical on screen
  const ez = norm3(dir);
  let u = up.map((x, i) => x - dot3(up, ez) * ez[i]);
  if (Math.hypot(...u) < 1e-6) u = [0, 1, 0];
  const ey = norm3(u), ex = cross3(ey, ez);
  return qmat([ex, ey, ez]);
}
const HOME = qmul(qmul(qaxis([1, 0, 0], 20), qaxis([0, 1, 0], -30)), lookAlong(cross3(A[0], A[2]).map(x => -x), A[2]));
let quat = HOME.slice();
function applyCam() {
  const v = viewer.getView(); v[4] = quat[0]; v[5] = quat[1]; v[6] = quat[2]; v[7] = quat[3];
  viewer.setView(v);
  drawAxes();
}
// --- orientation axes (bottom right): a, b, c as the current rotation shows them; click a label to look along it
function rotv(q, v) {  // rotate vector v by unit quaternion q = [x, y, z, w]
  const [x, y, z, w] = q, t = [2 * (y*v[2] - z*v[1]), 2 * (z*v[0] - x*v[2]), 2 * (x*v[1] - y*v[0])];
  return [v[0] + w*t[0] + y*t[2] - z*t[1], v[1] + w*t[1] + z*t[0] - x*t[2], v[2] + w*t[2] + x*t[1] - y*t[0]];
}
function drawAxes() {
  const svg = $("axes");
  svg.style.display = $("t_axes").checked ? "" : "none";
  if (!$("t_axes").checked) return;
  const cols = ["#ff5252", "#4caf50", "#448aff"], L = 38;
  const ax = [0, 1, 2].map(i => ({i, s: rotv(quat, norm3(A[i]))})).sort((p, q) => p.s[2] - q.s[2]);  // back to front
  svg.innerHTML = ax.map(({i, s}) => {
    const x = L * s[0], y = -L * s[1], op = s[2] < -0.2 ? 0.55 : 1;   // screen y points down
    return `<g opacity="${op}"><line x1="0" y1="0" x2="${x}" y2="${y}" stroke="${cols[i]}" stroke-width="2.5" stroke-linecap="round"/>` +
      `<text x="${1.3 * x}" y="${1.3 * y}" fill="${cols[i]}" data-i="${i}"><title>look along ${"abc"[i]}</title>${"abc"[i]}</text></g>`;
  }).join("") + '<circle r="2.5" fill="#9aa0a6"/>';
  svg.querySelectorAll("text").forEach(t => t.onclick = () => viewAlong(A[+t.dataset.i]));
}
function viewAlong(axis) { quat = lookAlong(axis, Math.abs(dot3(norm3(axis), norm3(A[2]))) > 0.99 ? A[1] : A[2]); applyCam(); }
function lockedAxis() {
  const m = $("axis").value;
  if (m === "free") return null;
  if (m !== "uvw") return A["abc".indexOf(m)];
  const w = $("uvw").value.trim().split(/[\s,]+/).map(Number);
  if (w.length !== 3 || w.some(x => !isFinite(x)) || w.every(x => x === 0)) { $("msg").textContent = "[u v w]: three numbers"; return null; }
  $("msg").textContent = "";
  return [0, 1, 2].map(c => w[0] * A[0][c] + w[1] * A[1][c] + w[2] * A[2][c]);
}
$("axis").onchange = () => { $("uvw").style.display = $("axis").value === "uvw" ? "" : "none"; };
(function rotation() {
  // The drag is ours from mousedown to mouseup, whatever e.buttons says (trackpads often report 0
  // during a drag). Once the pointer moves, 3Dmol's own drag state is cleared, so its trackball
  // (which rotates relative to the drag start) can never take over, and the drag is not a click.
  const el = $("viewer"); let last = null, moved = false;
  const end = () => { last = null; moved = false; };
  el.addEventListener("mousedown", e => {
    if (e.button === 0 && !e.ctrlKey && !e.shiftKey && !e.metaKey) { last = {x: e.clientX, y: e.clientY}; moved = false; }
  }, true);
  window.addEventListener("mousemove", e => {
    if (!last) return;
    e.stopPropagation();                       // keep 3Dmol's trackball and hover picking out
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!moved && Math.hypot(dx, dy) < 3) return;   // small jitter: still a click
    moved = true; viewer.isDragging = false;
    if (!dx && !dy) return;                    // trackpads send zero-length moves mid-drag
    last = {x: e.clientX, y: e.clientY};
    const k = 0.4, axis = lockedAxis();       // degrees per pixel
    const next = axis ? qnorm(qmul(quat, qaxis(axis, k * dx)))                          // model-frame axis
                      : qnorm(qmul(qaxis([dy, dx, 0], k * Math.hypot(dx, dy)), quat));  // screen-frame axis
    if (!next.every(isFinite)) return;         // never let a bad step blank the scene
    quat = next;
    applyCam();
  }, true);
  window.addEventListener("mouseup", end, true);
  window.addEventListener("blur", end);
  document.addEventListener("mouseleave", end);
})();

// --- isosurface level: text box, slider and presets stay in sync
function setLevel(e) {
  const x = parseFloat(String(e).replace(",", "."));
  if (!isFinite(x)) { $("msg").textContent = "level: not a number"; return; }
  $("msg").textContent = "";
  level = Math.max(0, x);
  $("levelnum").value = level.toFixed(3);
  $("slider").value = level;
  if (surf) { viewer.removeShape(surf); surf = null; }
  const t = performance.now();
  if ($("t_surf").checked) surf = viewer.addIsosurface(vol, {isoval: level, color: "#8fd3a8", opacity: 0.8});
  viewer.render();
  window.timing.isosurface_ms = performance.now() - t;
}

// --- full scene for the current supercell
function build() {
  const t = performance.now();
  clearMeasurements();
  viewer.removeAllModels(); viewer.removeAllShapes(); viewer.removeAllSurfaces();
  surf = null; polyShapes = []; cellShapes = []; bondShapes = [];
  const L = atomList();
  models.fw = addModel(L.fw, "atom"); models.im = addModel(L.im, "image"); models.mn = addModel(L.mn, "site");
  const box = [0, 1, 2, 3, 4, 5, 6, 7].map(b => ({elem: "H", xyz: shift(sc[0] * ((b >> 2) & 1), sc[1] * ((b >> 1) & 1), sc[2] * (b & 1))}));
  models.box = addModel(box, "box"); models.box.setStyle({}, {});
  styleAtoms(); styleSites(); drawCells(); drawPolyhedra(); drawBonds();
  viewer.setHoverable({}, true, hoverOn, hoverOff);
  viewer.setClickable({}, true, onClick);
  buildVolume();
  viewer.zoomTo({model: models.box}); viewer.zoom(0.8); applyCam();
  setLevel(level === null ? D.opts.level : level);
  window.timing.build_ms = performance.now() - t;
}

// --- hover labels
function name(a) {
  const i = a.info, c = i.cellidx, tag = (c[0] || c[1] || c[2]) ? `[${c.join(",")}]` : "";
  if (a.tag === "site") return `site${i.idx}${tag}`;
  return `${i.elem}${a.tag === "image" ? "'" : i.idx}${tag}`;
}
function describe(a) {
  const i = a.info;
  if (a.tag === "site") return `${name(a)}: E = ${fmt(i.e)} eV`;
  const q = i.q === undefined ? "" : ` (${i.q > 0 ? "+" : ""}${i.q})`;
  return `${name(a)}${a.tag === "image" ? " (image)" : ""}${q}  frac ${add3(i.frac, a.tag === "image" ? [0, 0, 0] : i.cellidx).map(v => v.toFixed(3)).join(" ")}`;
}
function hoverOn(a, v) { if (a.tag !== "box" && !a.label) a.label = v.addLabel(describe(a), {position: a, backgroundOpacity: 0.75, fontSize: 12}); }
function hoverOff(a, v) { if (a.label) { v.removeLabel(a.label); delete a.label; } }

// --- click on a polyhedron: neighbors, bond lengths, distortion, volume
function showPolyhedron(p, c) {
  hilite.forEach(s => viewer.removeShape(s)); hilite = [];
  const T = shift(...c);
  p.edges.forEach(([a, b]) => hilite.push(viewer.addCylinder(
    {start: P(add3(a, T)), end: P(add3(b, T)), radius: 0.06, color: "#00c853", fromCap: 1, toCap: 1})));
  const tag = (c[0] || c[1] || c[2]) ? `[${c.join(",")}]` : "";
  const q = p.q ? ` (${p.q > 0 ? "+" : ""}${p.q})` : "";
  const rows = p.ligands.map(l => {
    const cellOf = add3(l.image, c);  // the neighbor's own cell in the supercell
    const img = cellOf.some(x => x) ? ` [${cellOf.join(",")}]` : "";
    return `<tr><td>${l.elem}${l.idx}${img}</td><td class="r">${fmt(l.d)} Å</td></tr>`;
  }).join("");
  $("poly").innerHTML = `<div class="ph">${p.elem}${p.idx}${tag}${q} · CN ${p.ligands.length}</div>` +
    `<div class="pm">⟨d⟩ ${fmt(p.d_mean)} Å · distortion ${p.distortion.toFixed(4)} · V ${fmt(p.volume)} Å³</div>` +
    `<table>${rows}</table>`;
  viewer.render();
}

// --- click: distances and angles
const sub = (a, b) => [a.x - b.x, a.y - b.y, a.z - b.z];
const norm = v => Math.hypot(...v);
const Ainv = (() => {  // inverse of the cell matrix (rows a, b, c): frac = xyz · Ainv
  const [a, b, c] = A, det = a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0]);
  return [[b[1]*c[2]-b[2]*c[1], a[2]*c[1]-a[1]*c[2], a[1]*b[2]-a[2]*b[1]],
          [b[2]*c[0]-b[0]*c[2], a[0]*c[2]-a[2]*c[0], a[2]*b[0]-a[0]*b[2]],
          [b[0]*c[1]-b[1]*c[0], a[1]*c[0]-a[0]*c[1], a[0]*b[1]-a[1]*b[0]]].map(r => r.map(x => x / det));
})();
const toFrac = r => [0, 1, 2].map(j => r[0] * Ainv[0][j] + r[1] * Ainv[1][j] + r[2] * Ainv[2][j]);
const f3 = v => v.map(x => x.toFixed(3).padStart(7)).join("");
// one click: info + highlight; double-click two atoms: distance; triple-click three atoms: angle
const CLICK_MS = 300;
let clickAtom = null, clickCount = 0, clickTimer = null, selMark = null, dpicks = [], apicks = [];
function onClick(a, v) {
  if (a.tag === "box") return;
  clickCount = a === clickAtom ? clickCount + 1 : 1;
  clickAtom = a;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { const n = clickCount; clickAtom = null; clickCount = 0; resolveClick(a, Math.min(n, 3)); }, CLICK_MS);
}
const say = t => { $("out").textContent += t + "\n"; $("out").scrollTop = $("out").scrollHeight; };
const C = a => ({x: a.x, y: a.y, z: a.z});
function resolveClick(a, n) {
  const v = viewer;
  if (n === 1) {
    if (selMark) v.removeShape(selMark);
    selMark = v.addSphere({center: C(a), radius: 0.45, color: "#ffd600", opacity: 0.55});
    const r = [a.x, a.y, a.z];
    say(`${name(a)}${a.tag === "image" ? " (image)" : ""}\n  frac${f3(toFrac(r))}\n  cart${f3(r)} Å`);
  } else if (n === 2) {
    dpicks.push(a);
    marks.push(v.addSphere({center: C(a), radius: 0.4, color: "#00c853", opacity: 0.5}));
    if (dpicks.length === 2) {
      const [p, q] = dpicks, d = norm(sub(p, q));
      marks.push(v.addCylinder({start: C(p), end: C(q), radius: 0.04, dashed: true, color: "#00c853"}));
      marks.push(v.addLabel(`${fmt(d)} Å`, {position: {x:(p.x+q.x)/2, y:(p.y+q.y)/2, z:(p.z+q.z)/2}, backgroundColor: "#00c853", fontSize: 12}));
      say(`d(${name(p)}–${name(q)}) = ${fmt(d)} Å`);
      dpicks = [];
    } else say(`distance: ${name(a)} – … (double-click the 2nd atom)`);
  } else {
    apicks.push(a);
    marks.push(v.addSphere({center: C(a), radius: 0.4, color: "#2979ff", opacity: 0.5}));
    if (apicks.length === 3) {
      const [a1, b1, c1] = apicks, u = sub(a1, b1), w = sub(c1, b1);
      const ang = Math.acos(Math.max(-1, Math.min(1, (u[0]*w[0] + u[1]*w[1] + u[2]*w[2]) / (norm(u) * norm(w))))) * 180 / Math.PI;
      [[a1, b1], [b1, c1]].forEach(([p, q]) => marks.push(v.addCylinder({start: C(p), end: C(q), radius: 0.04, dashed: true, color: "#2979ff"})));
      marks.push(v.addLabel(`${ang.toFixed(1)}°`, {position: C(b1), backgroundColor: "#2979ff", fontSize: 12}));
      say(`∠(${name(a1)}–${name(b1)}–${name(c1)}) = ${ang.toFixed(1)}°`);
      apicks = [];
    } else say(`angle: ${apicks.map(name).join("–")}${apicks.length === 1 ? "–…–…" : "–…"} (triple-click ${apicks.length === 1 ? "the vertex" : "the 3rd atom"})`);
  }
  v.render();
}
function clearMeasurements() {
  marks.forEach(m => { if (m instanceof $3Dmol.Label) viewer.removeLabel(m); else viewer.removeShape(m); });
  hilite.forEach(s => viewer.removeShape(s));
  if (selMark) viewer.removeShape(selMark);
  selMark = null; marks = []; picks = []; dpicks = []; apicks = []; hilite = []; $("out").textContent = ""; $("poly").innerHTML = "";
}

// --- controls
const B = D.barriers, finiteB = ["e1d", "e2d", "e3d"].map(k => B[k]).filter(v => v !== null);
$("slider").max = Math.min(D.vmax, Math.max(1, ...finiteB.map(v => 2 * v)));
$("bar").innerHTML = ["e1d", "e2d", "e3d"].map((k, i) => `${i + 1}D <b>${B[k] === null ? "∞" : fmt(B[k])}</b>`).join(" · ") + " eV";
document.querySelectorAll("button[data-b]").forEach(b => {
  const v = B[b.dataset.b];
  if (v === null) { b.disabled = true; b.title = "no percolation"; }
  else { b.onclick = () => setLevel(v + 0.01); b.title = `${b.dataset.b} = ${fmt(v)} eV (+0.01)`; }
});
$("slider").oninput = () => setLevel($("slider").value);
$("levelnum").onchange = () => setLevel($("levelnum").value);
$("levelnum").onkeydown = e => { if (e.key === "Enter") setLevel($("levelnum").value); };
["nx", "ny", "nz"].forEach((id, d) => $(id).onchange = () => {
  const x = Math.round(+$(id).value);
  if (!(x >= 1 && x <= 4)) { $("msg").textContent = "supercell: 1 to 4 per axis"; $(id).value = sc[d]; return; }
  sc[d] = x; $("msg").textContent = ""; build();
});
$("t_surf").onchange = () => setLevel(level);
$("t_poly").onchange = () => { drawPolyhedra(); viewer.render(); };
$("t_min").onchange = () => { styleSites(); viewer.render(); };
$("t_axes").onchange = drawAxes;
$("t_atoms").onchange = () => { $("elems").classList.toggle("off", !$("t_atoms").checked); styleAtoms(); viewer.render(); };
$("t_elx").onclick = e => {  // expand the per-element toggles (the click must not toggle "Atoms")
  e.preventDefault(); const el = $("elems"), open = el.style.display === "none";
  el.style.display = open ? "grid" : "none"; $("t_elx").textContent = open ? "▾" : "▸";
};
$("elems").innerHTML = Object.entries(D.elements).map(([e, s]) =>
  `<label><input type="checkbox" data-e="${e}"${hidden.has(e) ? "" : " checked"}><span class="dot" style="background:${s.color}"></span>${e}</label>`).join("");
$("elems").querySelectorAll("input").forEach(b => b.onchange = () => {
  if (b.checked) hidden.delete(b.dataset.e); else hidden.add(b.dataset.e);
  styleAtoms(); viewer.render();
});
$("t_bonds").onchange = () => { drawBonds(); viewer.render(); };
$("clear").onclick = () => { clearMeasurements(); viewer.render(); };

const [formula, ...model] = D.title.split(" · ");
$("title").textContent = formula; $("sub").textContent = model.join(" · "); $("sub").title = model.join(" · ");
$("collapse").onclick = () => { const c = document.body.classList.toggle("collapsed"); $("collapse").textContent = c ? "+" : "−"; };
$("va").onclick = () => viewAlong(A[0]);
$("vb").onclick = () => viewAlong(A[1]);
$("vc").onclick = () => viewAlong(A[2]);
// reset: starting orientation, box centered again (undoes panning) and the starting zoom
function resetView() { quat = HOME.slice(); viewer.zoomTo({model: models.box}); viewer.zoom(0.8); applyCam(); }
$("home").onclick = resetView;
// starting state from view(..., **options)
[["t_surf", "isosurface"], ["t_poly", "polyhedra"], ["t_bonds", "bonds"], ["t_min", "sites"], ["t_atoms", "atoms"], ["t_axes", "axes"]]
  .forEach(([id, k]) => { $(id).checked = D.opts[k]; });
sc = D.opts.supercell.slice(); ["nx", "ny", "nz"].forEach((id, d) => { $(id).value = sc[d]; });
if (D.opts.axis) { $("axis").value = D.opts.axis; $("axis").onchange(); }
$("t_dark").checked = D.opts.theme === "dark"; $("t_dark").onchange = applyTheme; applyTheme();
build();
if (D.opts.view) viewAlong(A["abc".indexOf(D.opts.view)]);
</script></body></html>
